name: nightly-product-gate

# EP0.6 — nightly device/product gate, separate from the fast PR gate in ci.yml.
# Builds the release-equivalent `product` variant, then boots an emulator and runs
# the on-device product gate, capturing the PRODUCT_*_RESULT lines. With the
# current (simulated) guest most fields are false; this job is the harness that
# turns "true" as EP2–EP10 land. It does not gate PRs.

on:
  schedule:
    - cron: '0 17 * * *' # 02:00 KST daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-build:
    name: Build product (release-equivalent) variant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - uses: android-actions/setup-android@v3
      - name: Assemble product variant
        run: ./gradlew --no-daemon :app:assembleProduct
      - name: Upload product APK
        uses: actions/upload-artifact@v4
        with:
          name: product-apk
          path: app/build/outputs/apk/product/*.apk
          if-no-files-found: error

  device-product-gate:
    name: On-device product gate (emulator)
    runs-on: ubuntu-latest
    needs: product-build
    # Honest about scope: the gate currently reports mostly false because the
    # guest runtime is simulated until EP2–EP4. Do not fail the workflow on a
    # not-yet-green gate; failing the *harness* (build/boot/broadcast) still fails.
    continue-on-error: true
    strategy:
      matrix:
        api-level: [26, 29]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Run product gate on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          script: |
            ./gradlew --no-daemon :app:installProduct
            adb logcat -c
            adb shell am broadcast \
              -a dev.jongwoo.androidvm.product.RUN_PRODUCT_GATE \
              -n dev.jongwoo.androidvm/.product.ProductGateReceiver
            sleep 5
            adb logcat -d -s AVM.ProductGate | tee product-gate-${{ matrix.api-level }}.log
            # Harness sanity: the gate must at least emit its lines.
            grep -q "PRODUCT_RUNTIME_RESULT" product-gate-${{ matrix.api-level }}.log
      - name: Upload product gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-gate-log-api${{ matrix.api-level }}
          path: product-gate-*.log
          if-no-files-found: ignore
